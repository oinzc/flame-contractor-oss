name: 功能建议
description: 提出新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认建议落在项目边界内：单人、本机、少量好友、低频发送。批量群发、养号、自动加好友一类的需求不会接受。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景与当前的痛点，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的想法
      description: 可以描述交互、配置项或数据结构上的改动
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 边界确认
      options:
        - label: 这个建议不涉及批量群发、自动加好友、绕过验证码或对抗风控
          required: true
